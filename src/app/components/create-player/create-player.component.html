<div class="page fade-up">
  <a routerLink="/" class="back-link">{{ i18n.t('common.back') }}</a>

  <div class="glass panel form-card">
    <h1>{{ i18n.t('create.title') }}</h1>

    <p class="muted">{{ i18n.t('create.subtitle') }}</p>

    @if (submitError()) {
      <p class="banner-error pop-in">{{ submitError() }}</p>
    }

    <label>
      {{ i18n.t('field.name') }}
      <input
        type="text"
        maxlength="40"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
      >
    </label>

    <label>
      {{ i18n.t('field.shortname') }} <span class="muted">{{ i18n.t('create.shortnameHint') }}</span>
      <input
        type="text"
        maxlength="20"
        [ngModel]="shortname()"
        (ngModelChange)="shortname.set($event)"
      >
      <span class="field-hint muted small">
        {{ i18n.t('create.shortnameHelp') }}
        <code>assets/{{ '{' }}{{ i18n.t('field.shortname') }}{{ '}' }}-padel.png</code>.
      </span>
    </label>

    <label>
      {{ i18n.t('create.startRating') }}
      <input
        type="number"
        min="0"
        max="9999"
        [ngModel]="startingRating()"
        (ngModelChange)="startingRating.set(+$event)"
      >
      <span class="field-hint muted small">{{ i18n.t('create.defaultRating') }}</span>
    </label>

    <div class="skills-editor">
      <div class="skills-header">
        <h3>{{ i18n.t('skills.title') }}</h3>
        <span class="muted small">{{ i18n.t('skills.range') }}</span>
      </div>

      @for (skill of skillNames; track skill) {
        <label class="skill-field">
          <div class="skill-row">
            <span>{{ i18n.t('skill.' + skill) }}</span>
            <strong>{{ skills()[skill] }}</strong>
          </div>
          <input
            type="range"
            min="0"
            max="10"
            step="1"
            [ngModel]="skills()[skill]"
            (ngModelChange)="updateSkill(skill, +$event)"
          >
        </label>
      }
    </div>

    <button
      class="btn btn-primary big"
      [disabled]="submitting()"
      (click)="createPlayer()"
    >
      {{ submitting() ? i18n.t('create.submitting') : i18n.t('create.submit') }}
    </button>
  </div>
</div>
