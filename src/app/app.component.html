<div class="admin-bar">
  @if (admin.isAdmin()) {
    <span class="admin-badge">🔓</span>
    <button class="admin-btn" (click)="logoutAdmin()">Log ud</button>
  } @else if (adminInputOpen()) {
    <input
      class="admin-input"
      type="password"
      placeholder="Kode…"
      [ngModel]="adminCode()"
      (ngModelChange)="adminCode.set($event)"
      (keyup.enter)="submitAdminCode()"
      [class.error]="adminError()"
      autofocus
    >
    <button class="admin-btn" (click)="submitAdminCode()">OK</button>
    <button class="admin-btn ghost" (click)="toggleAdminInput()">✕</button>
  } @else {
    <button class="admin-btn" (click)="toggleAdminInput()">🔒</button>
  }
</div>

<main class="app-shell">
  <router-outlet></router-outlet>
</main>

<div class="audio-fab">
  <button
    class="audio-btn"
    [class.off]="audio.musicMuted()"
    (click)="audio.toggleMusic()"
    title="Musik"
  >🎵</button>
  <button
    class="audio-btn"
    [class.off]="audio.sfxMuted()"
    (click)="audio.toggleSfx()"
    title="Lydeffekter"
  >🔊</button>
</div>
