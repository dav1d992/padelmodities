<div class="admin-bar">
  <button
    class="audio-btn"
    [class.off]="audio.musicMuted()"
    (click)="audio.toggleMusic()"
    [title]="i18n.t('app.music')"
  >🎵</button>
  <button
    class="audio-btn"
    [class.off]="audio.sfxMuted()"
    (click)="audio.toggleSfx()"
    [title]="i18n.t('app.sfx')"
  >🔊</button>
  <button class="admin-btn lang-btn" (click)="i18n.toggle()" [title]="i18n.t('app.language')">
    {{ i18n.lang() === 'da' ? 'EN' : 'DA' }}
  </button>
  @if (admin.isAdmin()) {
    <span class="admin-badge">🔓</span>
    <button class="admin-btn" (click)="logoutAdmin()">{{ i18n.t('app.logout') }}</button>
  } @else if (adminInputOpen()) {
    <input
      class="admin-input"
      type="password"
      name="admin-otp"
      autocomplete="one-time-code"
      [ngModel]="adminCode()"
      (ngModelChange)="adminCode.set($event)"
      (keyup.enter)="submitAdminCode()"
      [class.error]="adminError()"
      autofocus
    >
    <button class="admin-btn" (click)="submitAdminCode()">OK</button>
    <button class="admin-btn ghost" (click)="toggleAdminInput()">✕</button>
  } @else {
    <button class="admin-btn" (click)="toggleAdminInput()">🔒</button>
  }
</div>

<main class="app-shell" [@routeFade]="prepareRoute(outlet)">
  <router-outlet #outlet="outlet"></router-outlet>
</main>
